<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daylight Hours vs Witness Count - Haunted Places</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .tooltip {
            position: absolute;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border-radius: 5px;
            pointer-events: none;
            font-size: 12px;
        }
        .scatter-container {
            margin: 20px auto;
            max-width: 900px;
        }
        h1, h2 {
            text-align: center;
            color: #333;
        }
        .axis-label {
            font-size: 14px;
            fill: #555;
        }
    </style>
</head>
<body>
    <div class="scatter-container">
        <h1>Haunted Places Analysis</h1>
        <h2>Relationship Between Daylight Hours and Witness Count</h2>
        <div id="scatter-plot"></div>
    </div>

    <script>
        // Set up dimensions for the chart
        const margin = {top: 50, right: 50, bottom: 70, left: 80};
        const width = 800 - margin.left - margin.right;
        const height = 500 - margin.top - margin.bottom;

        // Create SVG element
        const svg = d3.select("#scatter-plot")
            .append("svg")
            .attr("width", width + margin.left + margin.right)
            .attr("height", height + margin.top + margin.bottom)
            .append("g")
            .attr("transform", `translate(${margin.left}, ${margin.top})`);

        // Create tooltip div
        const tooltip = d3.select("body").append("div")
            .attr("class", "tooltip")
            .style("opacity", 0);

        // Load the data
        d3.json("data/HW3_haunted_places.json").then(data => {
            // Filter out entries with missing values
            const filteredData = data.filter(d => 
                d.daylight_hours && !isNaN(parseFloat(d.daylight_hours)) && 
                d.witness_count && !isNaN(parseInt(d.witness_count))
            );

            // Convert string values to numbers
            filteredData.forEach(d => {
                d.daylight_hours = parseFloat(d.daylight_hours);
                d.witness_count = parseInt(d.witness_count);
            });

            // Set up scales
            const xScale = d3.scaleLinear()
                .domain([d3.min(filteredData, d => d.daylight_hours) * 0.9, 
                         d3.max(filteredData, d => d.daylight_hours) * 1.1])
                .range([0, width]);

            const yScale = d3.scaleLinear()
                .domain([0, d3.max(filteredData, d => d.witness_count) * 1.1])
                .range([height, 0]);

            // Color scale based on apparition_type
            const apparitionTypes = [...new Set(filteredData.map(d => d.apparition_type))];
            const colorScale = d3.scaleOrdinal()
                .domain(apparitionTypes)
                .range(d3.schemeCategory10);

            // Create x-axis
            svg.append("g")
                .attr("transform", `translate(0, ${height})`)
                .call(d3.axisBottom(xScale));

            // Add x-axis label
            svg.append("text")
                .attr("class", "axis-label")
                .attr("x", width / 2)
                .attr("y", height + margin.bottom / 2)
                .style("text-anchor", "middle")
                .text("Daylight Hours");

            // Create y-axis
            svg.append("g")
                .call(d3.axisLeft(yScale));

            // Add y-axis label
            svg.append("text")
                .attr("class", "axis-label")
                .attr("transform", "rotate(-90)")
                .attr("x", -height / 2)
                .attr("y", -margin.left / 1.5)
                .style("text-anchor", "middle")
                .text("Witness Count");

            // Create scatter plot points
            svg.selectAll("circle")
                .data(filteredData)
                .enter()
                .append("circle")
                .attr("cx", d => xScale(d.daylight_hours))
                .attr("cy", d => yScale(d.witness_count))
                .attr("r", 6)
                .style("fill", d => colorScale(d.apparition_type))
                .style("opacity", 0.7)
                .style("stroke", "#333")
                .style("stroke-width", 1)
                .on("mouseover", function(event, d) {
                    d3.select(this)
                        .transition()
                        .duration(200)
                        .attr("r", 9)
                        .style("opacity", 1);
                        
                    tooltip.transition()
                        .duration(200)
                        .style("opacity", .9);
                        
                    tooltip.html(`<strong>${d.location}, ${d.city}, ${d.state}</strong><br/>
                                  Apparition Type: ${d.apparition_type}<br/>
                                  Daylight Hours: ${d.daylight_hours}<br/>
                                  Witness Count: ${d.witness_count}<br/>
                                  Evidence: ${d.has_visual_evidence === "True" ? "Visual" : ""} 
                                  ${d.has_audio_evidence === "True" ? "Audio" : ""}`)
                        .style("left", (event.pageX + 10) + "px")
                        .style("top", (event.pageY - 28) + "px");
                })
                .on("mouseout", function() {
                    d3.select(this)
                        .transition()
                        .duration(500)
                        .attr("r", 6)
                        .style("opacity", 0.7);
                        
                    tooltip.transition()
                        .duration(500)
                        .style("opacity", 0);
                });

            // Add a legend
            const legend = svg.append("g")
                .attr("class", "legend")
                .attr("transform", `translate(${width - 120}, 0)`);

            apparitionTypes.forEach((type, i) => {
                const legendRow = legend.append("g")
                    .attr("transform", `translate(0, ${i * 20})`);
                
                legendRow.append("rect")
                    .attr("width", 10)
                    .attr("height", 10)
                    .attr("fill", colorScale(type));
                
                legendRow.append("text")
                    .attr("x", 20)
                    .attr("y", 10)
                    .attr("text-anchor", "start")
                    .style("font-size", "12px")
                    .text(type);
            });

            // Add a title for the legend
            legend.append("text")
                .attr("y", -10)
                .style("font-weight", "bold")
                .style("font-size", "12px")
                .text("Apparition Types");

        }).catch(error => {
            console.error("Error loading the data:", error);
            document.getElementById("scatter-plot").innerHTML = 
                "<p style='color: red;'>Error loading data. Please check the console for details.</p>";
        });
    </script>
</body>
</html>
